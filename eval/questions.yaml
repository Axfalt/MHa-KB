# Retrieval test set. Run with `mhkb eval`.
#
# expect: document keys (or key prefixes without the language suffix) that contain the answer.
#         A question is a hit when any of them is in the top-k results.
# level:  easy   = the answer is in an entity card or help page named in the question
#         medium = the right document must be inferred from the question
#         hard   = the answer is a number or rule that only exists in config/code (Phase 3 target)
#         casual = phrased like a player on Discord: slang, typos, no official names
# facts:  optional; statements a correct answer must contain (graded by `mhkb eval --answers`)
# note:   optional; "partial" means the expected documents only answer qualitatively (no numbers),
#         "not indexed" means no document contains the answer yet

