[package]
name = "kb-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
fastembed = "7.2.0"
hex = "0.4.3"
# The version fastembed uses: one ONNX Runtime environment must be shared by the embedder and the reranker
ort = { version = "=2.0.0-rc.15", default-features = false }
pgvector = { version = "0.4.2", features = ["sqlx"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "json"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
walkdir = "2.5.0"
