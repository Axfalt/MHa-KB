  scope: "How the camping survival chance is computed, building/ruin camping bonus, camping improvements and tombs, items, jobs (survivalist), statuses, hero skills, caps, night decay of improvements, town types."
- id: night-attack
  title: "The nightly attack"
  scope: "What happens at midnight, order of the nightly stages, number of attacking zombies, town defense check, open door, house attacks and deaths, devastation."
- id: attack-estimation
