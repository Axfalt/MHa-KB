# Topics for the generated dossiers (`mhkb dossier`), written to knowledge/topics/<id>.md.
# scope: what the dossier must cover; it guides the research.

- id: digging
  title: "Digging in the desert"
  scope: "Success chance when digging a zone, depleted zones and their regeneration, the night penalty and what cancels it, job bonuses, statuses, zone scout level, dig timers, what items can be found."
- id: scavenging-buildings
  title: "Searching buildings (ruins) in the desert"
  scope: "Searching a ruin/building in the World Beyond, chance to find nothing, buried buildings and clearing them, drops, camping bonus of buildings."
